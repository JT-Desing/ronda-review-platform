version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    target-branch: main
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    target-branch: main
  - package-ecosystem: docker
    directories: [/, /backend, /backend/offsite]
    schedule: { interval: weekly }
    target-branch: main
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: main
    groups:
      actions:
        patterns: ["*"]
