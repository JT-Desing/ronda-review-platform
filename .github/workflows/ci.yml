name: CI

on:
  pull_request:
  push:
    branches: [main, feature/shared-review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a push run: it may be publishing images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # pdf-runtime.test.js checks the frontend's pdfjs-dist, resolved from the root.
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - run: npm ci
      - run: npm test
      - name: Integration tests (disposable PostgreSQL service)
        run: node integration-suite.js
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          RONDA_ALLOW_INTEGRATION: "1"
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build web image and check its nginx config
        run: |
          docker build -t ronda-web:ci .
          docker run --rm --add-host api:127.0.0.1 ronda-web:ci nginx -t
      - name: Build API image
        run: docker build -t ronda-api:ci backend

  stack:
    needs: [frontend, backend, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write a throwaway environment for the stack
        run: |
          pass=$(openssl rand -hex 24)
          cat > backend/.env <<ENV
          POSTGRES_USER=ronda
          POSTGRES_DB=ronda
          POSTGRES_PASSWORD=$pass
          DATABASE_URL=postgres://ronda:$pass@database:5432/ronda
          APP_ORIGIN=http://localhost:8080
          ENV
      - name: Start web, API and database
        run: docker compose up -d --build --wait --wait-timeout 180 ronda api database
      - name: Security smoke against the running stack
        run: node scripts/production-security-smoke.mjs
        env:
          RONDA_ORIGIN: http://localhost:8080
          RONDA_SMOKE_NO_REPORT: "1"
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: Load smoke (k6)
        run: k6 run tests/load/smoke.js
        env:
          RONDA_ORIGIN: http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 ronda api database
      - if: always()
        run: docker compose down -v

  # Free plan + private project: SonarCloud only keeps main-branch analyses.
  sonarcloud:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip when SonarCloud is not configured
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "enabled=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    # Publishes only after every test job passed on a push. The server pulls these
    # images (Arcane or `docker compose pull`), so CI never needs SSH or server secrets.
    needs: [frontend, backend, images, stack]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: ronda-web
            context: .
          - name: ronda-api
            context: backend
          - name: ronda-offsite
            context: backend/offsite
    env:
      HEAD_SHA: ${{ github.sha }}
      HEAD_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}"
          channel=$([ "$HEAD_BRANCH" = main ] && echo stable || echo edge)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$image:sha-${HEAD_SHA::12},$image:$channel" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: candidate:${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Block on fixable HIGH/CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: candidate:${{ matrix.name }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push with SBOM and provenance
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ env.HEAD_SHA }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
