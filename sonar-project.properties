sonar.projectKey=ronda-review_ronda-review-platform
sonar.organization=ronda-review
sonar.sources=src,backend,scripts
sonar.exclusions=**/node_modules/**,**/*.test.js,dist/**,docs/**,backend/*-integration.js,backend/integration.js,backend/*fixture*.js,backend/*qa*.js,backend/qa-*.js
sonar.tests=src,backend
sonar.test.inclusions=**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/frontend.lcov,coverage/backend.lcov
# React views have no DOM test runner yet; their logic lives in tested src/domain and
# component .js helpers. Coverage on new code is measured on that logic.
sonar.coverage.exclusions=src/**/*.jsx
